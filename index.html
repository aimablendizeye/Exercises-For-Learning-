<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Gym Home page</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <div class="flex ">
        <div class="bg-zinc-950 w-1/2 h-[800px]">
            <div class="flex gap-4 px-12 py-10">

            <img src="./Images/Container.png" >
            <img src="Images/Logo.png" class="w-28">

            </div>
            

        <div class="bg-gray-600 w-[450px] h-[600px] ml-28 rounded-2xl ">

            <div class="flex flex-col items-center">

            <img src="./Images/Developer workspace.png " class="w-[430px] h-[450px] rounded-2xl" >
            <h1 class="-mt-8 text-white text-2xl font-bold">Build Your Brain Muscle.</h1>
            <h3 class="text-amber-600">Code 10 Hours/Day</h3>

            </div>

            <div class="flex flex-col gap-2 pt-2 pl-8">
                <p>Intensive Mental Repetitions</p>
                <p>Technical CraftsmanShip Culture</p>
                <p>Industry-standard Tooling</p>

            </div>
           




        </div>



        </div>



    <div class="flex flex-col pl-24 gap-6 ">

        <div class="flex flex-col pt-16 gap-2">
            <h1 class="text-2xl font-bold">Welcome Back</h1>
            <p class=" text-gray-600">Continue Your Technical Journey</p>
       </div>

       <div class="flex gap-10 ">
        <button class="rounded-lg border border-black px-6 py-2">Trainee</button>
        <button class="rounded-lg border border-black px-6 py-2">Coach</button>
        <button class="rounded-lg border border-black px-6 py-2">Manager</button>
    
       </div>
       <div>
        <label for="text">Email Address </label> <br>
        <input type="text" placeholder="username@Gym.com" class="border border-black rounded-lg px-4 py-2 w-[400px] ">

       </div>

       <div>
        <label for="text">Password <span class="pl-52">Forgot Password</span></label><br>
        <input type="text" placeholder=".........." class="border border-black rounded-lg px-4 py-2 w-[400px] ">
       </div>

       <div class="flex gap-4">
        <input type="checkbox">
        <p class="">Keep me logged in</p>
       </div>

       <div class="rounded-lg bg-zinc-950 w-[400px]  " >
        <button class="text-amber-700  py-2 px-28 ">Sign in to Dashbord</button>

       </div>

       <div class="flex items-center gap-4 w-[400px] ">
         <div class=" w-[200px] h-px bg-gray-600"></div>
            <span class="text-gray-500 text-sm">OR</span>
         <div class=" w-[200px] h-px bg-gray-600"></div>
      </div>

      <div class="rounded-lg border border-black w-[400px]  px-20 py-2">
        <p>Continue With Google</p>
      </div>

      <div class="px-20">
        <p class="text-gray-600 ">Don't have an account <span class="px-6 underline text-black font-bold ">Register</span></p>
      </div>




    </div>

       
</div>


    
</body>
</html>
